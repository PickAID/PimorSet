schema_version = 1
template_version = "1.20.1-template-1.0.0"

[mod]
mod_id = "pimorset"
mod_name = "pimorset"
version = "0.0.19"
version_suffix = ""
group = "com.mihono.pickaid"
authors = ["M1hono"]
license = "MIT"
description = "An Armor Set Library for easier armor set creation."
credits = "None"
issue_tracker_url = "https://github.com/PickAID/PimorSet/issues"

[features]
jei = false
curios = false
geckolib = false
player_animator = false
mixin_extras = false

[dev_packs]
basic = false
appleskin = false
combat = false
curios = false
spell = false
kubejs = false

[overrides]
# Optional built-in feature version overrides.
# jei_version = "15.2.0.27"
# curios_version = "5.9.1+1.20.1"
# geckolib_version = "4.4.9"
# player_animator_version = "1.0.2+1.20"
# bendylib_version = "1.0.2"
# mixin_extras_version = "0.2.0-beta.8"

[repositories]
# Common ecosystem repositories are listed directly so the project surface stays visible.
blamejared = "https://maven.blamejared.com/"
tterrag = "https://maven.tterrag.com/"
sponge = "https://repo.spongepowered.org/maven"
geckolib = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
curios = "https://maven.theillusivec4.top/"
kosmx = "https://maven.kosmx.dev/"
cursemaven = "https://cursemaven.com"
architectury = "https://maven.architectury.dev"
latvian = "https://maven.latvian.dev/releases"
jitpack = "https://jitpack.io"
mihono = "https://maven.mihono.cn/repository/pickaid1201/"

[dependencies.deobf_compile_only]
curios = "top.theillusivec4.curios:curios-forge:5.9.1+1.20.1"
kubejs = "dev.latvian.mods:kubejs-forge:2001.6.5-build.16"
rhino = "dev.latvian.mods:rhino-forge:2001.2.2-build.18"

[dependencies.deobf_implementation]
architectury = { notation = "dev.architectury:architectury-forge:9.1.12", transitive = false }
pibrary = { notation = "com.mihono.pickaid:pibrary:0.0.11", transitive = false }
pikey = { notation = "com.mihono.pickaid:pikey:0.0.2", transitive = false }
piengine = { notation = "com.mihono.pickaid:piengine:0.0.12", transitive = false }
pidatagraph = { notation = "com.mihono.pickaid:pidatagraph:0.0.7", transitive = false }
pidamage = { notation = "com.mihono.pickaid:pidamage:0.0.1", transitive = false }
pinet = { notation = "com.mihono.pickaid:pinet:0.0.6", transitive = false }
pirenderruntime = { notation = "com.mihono.pickaid:pirenderruntime:0.0.3", transitive = false }
pihud = { notation = "com.mihono.pickaid:pihud:0.0.2", transitive = false }
pigeorender = { notation = "com.mihono.pickaid:pigeorender:0.0.2", transitive = false }
piplayeranim = { notation = "com.mihono.pickaid:piplayeranim:0.0.2", transitive = false }
picontent = { notation = "com.mihono.pickaid:picontent:0.0.8", transitive = false }

[dependencies.jarjar]
pibrary = { notation = "com.mihono.pickaid:pibrary:0.0.11", range = "[0.0.11,0.1.0)", transitive = false }
pikey = { notation = "com.mihono.pickaid:pikey:0.0.2", range = "[0.0.2,0.1.0)", transitive = false }
piengine = { notation = "com.mihono.pickaid:piengine:0.0.12", range = "[0.0.12,0.1.0)", transitive = false }
pidatagraph = { notation = "com.mihono.pickaid:pidatagraph:0.0.7", range = "[0.0.7,0.1.0)", transitive = false }
pidamage = { notation = "com.mihono.pickaid:pidamage:0.0.1", range = "[0.0.1,0.1.0)", transitive = false }
pinet = { notation = "com.mihono.pickaid:pinet:0.0.6", range = "[0.0.6,0.1.0)", transitive = false }
pirenderruntime = { notation = "com.mihono.pickaid:pirenderruntime:0.0.3", range = "[0.0.3,0.1.0)", transitive = false }
pihud = { notation = "com.mihono.pickaid:pihud:0.0.2", range = "[0.0.2,0.1.0)", transitive = false }
pigeorender = { notation = "com.mihono.pickaid:pigeorender:0.0.2", range = "[0.0.2,0.1.0)", transitive = false }
piplayeranim = { notation = "com.mihono.pickaid:piplayeranim:0.0.2", range = "[0.0.2,0.1.0)", transitive = false }
picontent = { notation = "com.mihono.pickaid:picontent:0.0.8", range = "[0.0.8,0.1.0)", transitive = false }

[publish]
maven_url = "https://maven.mihono.cn/repository/pickaid1201/"
curseforge_project = 0
modrinth_project = ""
release_type = "alpha"

[publish.mods]
game_versions = ["1.20.1"]
loaders = ["forge"]

[publish.modrinth]
changelog_file = "CHANGELOG.md"
changelog_section = "version"

[publish.curseforge]
changelog_file = "CHANGELOG.md"
changelog_section = "version"

[naming]
archive_name = "pimorset"
jar_format = "{archive_name}-{mc_version}-{version}"
